[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto_mega"
version = "0.1.0"
description = "Massive crypto trading signal system with pluggable strategies, resource management, and auto-execution"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "redis>=5.0",
    "celery>=5.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "asyncpg>=0.29",
    "websockets>=12.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3"]

[project.scripts]
crypto-mega = "crypto_mega.cli:main"

[tool.setuptools.packages.find]
include = ["crypto_mega*"]

[tool.ruff]
line-length = 120
target-version = "py311"
