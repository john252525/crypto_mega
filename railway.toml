# Railway deployment configuration
# This project uses multiple services from a single repo (monorepo).
# Each service is configured separately in the Railway dashboard.
#
# Setup in Railway:
# 1. Create a new project
# 2. Add PostgreSQL plugin → auto-injects DATABASE_URL
# 3. Add Redis plugin → auto-injects REDIS_URL
# 4. Create 3 services from this repo:
#
#    Service 1: "api" (web-facing)
#      Start command: uvicorn crypto_mega.api.app:app --host 0.0.0.0 --port $PORT
#      Health check: /health
#      Expose port: yes (public domain)
#
#    Service 2: "engine" (background)
#      Start command: python -m crypto_mega.cli run --symbols BTC/USDT,ETH/USDT,SOL/USDT --interval 60
#      No public port needed
#
#    Service 3: "worker" (background)
#      Start command: celery -A crypto_mega.engine.tasks:celery_app worker --loglevel=info --concurrency=4
#      No public port needed
#
# Environment variables to set (all services):
#   EXCHANGE_API_KEY, EXCHANGE_API_SECRET, EXCHANGE_SANDBOX=true
#   MAX_WORKERS=4, LOG_LEVEL=INFO
#
# The DATABASE_URL and REDIS_URL are auto-injected by Railway plugins.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
